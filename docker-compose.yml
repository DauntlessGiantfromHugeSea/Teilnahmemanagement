services:
  db:
    image: postgres:16-alpine
    container_name: tm-db
    restart: unless-stopped
    networks:
      - internal
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?bitte in .env setzen}
      POSTGRES_DB: ${POSTGRES_DB:-teilnahmemanagement}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Port nur intern - nicht nach aussen exponieren.
    # Zum Debuggen: "ports: [ '127.0.0.1:5432:5432' ]"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tm} -d ${POSTGRES_DB:-teilnahmemanagement}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: teilnahmemanagement:latest
    container_name: tm-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-tm}:${POSTGRES_PASSWORD}@tm-db:5432/${POSTGRES_DB:-teilnahmemanagement}?schema=public"
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?bitte in .env setzen (64 hex chars)}
      SESSION_SECRET: ${SESSION_SECRET:?bitte in .env setzen (>= 48 chars)}
      APP_NAME: ${APP_NAME:-FB-Akademie Teilnahmemanagement}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Optional: API-Key fuer den Webhook-Endpoint /api/public/anmeldungen
      # (>= 16 Zeichen, in .env setzen). Leer = Webhook deaktiviert.
      WEBHOOK_API_KEY: ${WEBHOOK_API_KEY:-}
      # Cloudflare Turnstile fuer das oeffentliche Anmeldeformular.
      # Beide leer = Spamschutz nur via Honeypot (akzeptabel fuer Testbetrieb).
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # SMTP / Mailversand (Newsletter, Double-Opt-In, Test-Mails, Einladungen).
      # Alle leer = Mailing deaktiviert (App laeuft weiterhin).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # Absender: MAIL_FROM bevorzugt, SMTP_FROM als Fallback (Abwaertskompat.).
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_FROM: ${SMTP_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      MAIL_ADMIN: ${MAIL_ADMIN:-}
      MAIL_LOGO_URL: ${MAIL_LOGO_URL:-}
      MAIL_BRAND_COLOR: ${MAIL_BRAND_COLOR:-#0f766e}
      MAIL_FOOTER_LINE: ${MAIL_FOOTER_LINE:-}
      # Iframe-Embedding der oeffentlichen Anmeldeseiten
      IFRAME_HOSTS: ${IFRAME_HOSTS:-fb-eng.de fb-stage.de fi-fb.de}
      NODE_ENV: production
      # Beim allerersten Start auf "1" setzen, dann wieder entfernen:
      RUN_SEED_ON_START: ${RUN_SEED_ON_START:-0}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@fb-akademie.de}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe!2026}
    networks:
      - internal       # Verbindung zur DB
      - proxy          # Wird vom externen fbe-caddy erreicht
    # Kein "ports:" - Zugriff erfolgt nur ueber den Reverse-Proxy im proxy-Netzwerk.
    volumes:
      # Persistenter Storage fuer hochgeladene Bilder (ueberlebt Rebuilds)
      - uploads_data:/app/public/uploads

networks:
  internal:
    driver: bridge
  proxy:
    # Externes Netzwerk - wurde vom fbe-tools-Stack erstellt.
    external: true
    name: fbe-tools_default

volumes:
  db_data:
  uploads_data:
